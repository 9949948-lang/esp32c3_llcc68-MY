[platformio]
default_envs = esp32c3_llcc68

[env:esp32c3_llcc68]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
board_build.flash_mode = dio
board_build.f_flash = 40000000L

build_flags = 
  -D PRIVATE_HW
  -I variants/esp32c3_llcc68
  -D MESHTASTIC_LOG_LEVEL=DEBUG
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
  https://github.com

monitor_speed = 115200
upload_protocol = esptool
upload_speed = 460800
